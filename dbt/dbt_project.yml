name: 'my_project'
version: '1.0.0'
config-version: 2

profile: 'my_project'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analysis"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  my_project:
    # Bronze layer - raw data staging
    bronze:
      +materialized: table
      +schema: bronze
    # Silver layer - cleaned and transformed data
    silver:
      +materialized: table
      +schema: silver
    # Gold layer - business-ready data marts
    gold:
      +materialized: table
      +schema: gold

seeds:
  my_project:
    +schema: raw
